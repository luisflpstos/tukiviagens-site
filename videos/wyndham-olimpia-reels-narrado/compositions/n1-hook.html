      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // calm footage: slow pushes and soft dissolves between the three shots
          tl.fromTo("#n1-vw1", { scale: 1.1 }, { scale: 1.0, duration: 1.95, ease: "sine.out" }, 0);
          tl.fromTo("#n1-vw2", { scale: 1.0 }, { scale: 1.07, duration: 1.95, ease: "sine.inOut" }, 1.6);
          tl.fromTo("#n1-vw2", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, 1.6);
          tl.fromTo("#n1-vw3", { scale: 1.08 }, { scale: 1.0, duration: 2.0, ease: "sine.out" }, 3.2);
          tl.fromTo("#n1-vw3", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.inOut" }, 3.2);
          tl.fromTo("#n1-shade", { opacity: 0.5 }, { opacity: 1, duration: 0.8, ease: "sine.out" }, 0);

          // discreet brand marks
          tl.fromTo("#n1-stripe", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 0.1);
          tl.fromTo("#n1-logo", { opacity: 0, y: -16 }, { opacity: 0.92, y: 0, duration: 0.6, ease: "power2.out" }, 0.35);

          // caption of the question, word by word with the voice
          tl.fromTo("#n1-q", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.22);
          tl.fromTo("#n1-q .w", { opacity: 0.25 }, { opacity: 1, duration: 0.18, ease: "none", stagger: 0.19 }, 0.3);

          // beat 1 — on "deixou os problemas de lado"
          tl.fromTo("#n1-b1 .w", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.1 }, 1.72);

          // beat 2 — on "curtiu sua família", a warmer, bigger landing
          tl.fromTo("#n1-b2", { scale: 0.82, y: 46, opacity: 0, rotation: -2 }, { scale: 1, y: 0, opacity: 1, rotation: -3, duration: 0.6, ease: "back.out(1.5)" }, 3.42);
          tl.fromTo("#n1-bolt", { scale: 0, rotation: -25, opacity: 0 }, { scale: 1, rotation: 8, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 3.8);
          tl.to("#n1-b2", { y: -8, duration: 1.1, ease: "sine.inOut" }, 4.05);
          window.__timelines["n1-hook"] = tl;
        })();
