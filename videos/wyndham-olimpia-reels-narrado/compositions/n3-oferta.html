      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // footage settles out of the bolt flash; panel rises
          tl.fromTo("#n3-vw1", { scale: 1.22 }, { scale: 1.06, duration: 2.12, ease: "power2.out" }, 0);
          tl.fromTo("#n3-vw2", { scale: 1.12 }, { scale: 1.0, duration: 3.73, ease: "power1.out" }, 2.12);
          tl.fromTo("#n3-panel", { yPercent: 100 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo("#n3-panel-edge", { yPercent: 400, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.08);

          // 1 — "Com a Tuki Viagens": the brand logo
          tl.fromTo("#n3-logo-card", { scale: 0.3, y: -60, opacity: 0, rotation: -8 },
            { scale: 1, y: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.34);

          // supporting headline — OFERTA RELÂMPAGO
          tl.fromTo("#n3-oferta", { x: -900, skewX: 18, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, 1.1);
          tl.fromTo("#n3-relampago", { x: 1000, skewX: -18, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.34, ease: "expo.out" }, 1.28);

          // 2 — "até vinte por cento de desconto": ATÉ 20% OFF is the focal point
          tl.fromTo("#n3-ate", { scale: 0, rotation: -20 }, { scale: 1, rotation: -6, duration: 0.36, ease: "back.out(2.2)" }, 1.8);
          tl.fromTo("#n3-pct", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "expo.out" }, 2.1);
          tl.fromTo("#n3-pct", { rotation: -3 }, { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 2.26);
          tl.fromTo("#n3-off", { y: 150, opacity: 0, skewX: -14 }, { y: 0, opacity: 1, skewX: 0, duration: 0.3, ease: "power4.out" }, 2.4);
          tl.fromTo("#n3-bolt-a", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.16, ease: "power4.out" }, 2.2);
          tl.fromTo("#n3-bolt-b", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.16, ease: "power4.out" }, 2.32);
          tl.to(["#n3-bolt-a", "#n3-bolt-b"], { opacity: 0.4, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, 2.5);
          tl.to("#n3-discount", { scale: 1.03, duration: 1.6, ease: "sine.inOut", transformOrigin: "40% 50%", yoyo: true, repeat: 1 }, 2.75);

          // Tuki: controlled slide with a soft bounce, then a gentle float
          tl.fromTo("#n3-tuki-wrap", { x: 700, rotation: 12 }, { x: 0, rotation: -3, duration: 0.62, ease: "back.out(1.4)" }, 2.8);
          tl.fromTo("#n3-tuki", { y: 0, rotation: 0 }, { y: -16, rotation: 2, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.42);

          // 3 — the hotel name
          tl.fromTo("#n3-wyndham span", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.045 }, 3.46);
          tl.fromTo("#n3-script-wipe", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.inOut" }, 4.0);
          window.__timelines["n3-oferta"] = tl;
        })();
